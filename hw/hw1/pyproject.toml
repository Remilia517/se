[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicurl-learning"
version = "1.0.0"
description = "A learning-focused curl-like HTTP client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0,<3.0.0"]

[project.scripts]
minicurl = "minicurl.cli:main"

[tool.setuptools]
packages = ["minicurl"]
