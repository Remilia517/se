services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studytask}
      POSTGRES_USER: ${POSTGRES_USER:-studytask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studytask_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studytask} -d ${POSTGRES_DB:-studytask}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [app-network]
  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studytask}:${POSTGRES_PASSWORD:-studytask_password}@db:5432/${POSTGRES_DB:-studytask}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-network]
  nginx:
    build: ./nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped
    networks: [app-network]
volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge
